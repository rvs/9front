name: Build userlands and kernels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: ['386', amd64, arm, arm64, mips, spim, power, power64, riscv64]
    env:
      KCI_WORK: /tmp/9front-ci
      KCI_SEED: /tmp/amd64.tar.gz
      KCI_CPUS: '2'
      KCI_TIMEOUT: '9000'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-system-x86 acl gh
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Fetch amd64 bootstrap from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern amd64.tar.gz --output "$KCI_SEED"

      - name: Build ${{ matrix.arch }} userland and kernels
        run: .github/ci/build.sh '${{ matrix.arch }}'

      # tar preserves executable modes, unlike uploading loose binaries.
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 9front-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ env.KCI_WORK }}/${{ matrix.arch }}/${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 9front-${{ matrix.arch }}-logs-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ env.KCI_WORK }}/${{ matrix.arch }}/metadata.txt
            ${{ env.KCI_WORK }}/${{ matrix.arch }}/console.log
            ${{ env.KCI_WORK }}/${{ matrix.arch }}/qemu.log
            ${{ env.KCI_WORK }}/${{ matrix.arch }}/root/.ci
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    needs: build
    uses: ./.github/workflows/smoke.yml
