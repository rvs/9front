# Build the riscv64 kernels of this commit with boot/rebuild, on the
# riscv64 userland of the pinned image (boot/images): 9rva23 (K1 and
# K3), 9rva23cpuwait (K1/K3, cpuwait boot method) and 9maxion.
# Boot-test 9rva23cpuwait with boot/test and 9maxion with its embedded
# smoke test, both in qemu-system-riscv64.
#
# The maxion configuration lives in sys/src/9/ainekko, which this branch
# does not have yet: its build and boot test are commented out below
# until it does.
name: Build and test RISC-V kernels

on:
  push:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # all of its history: boot/sync updates the image's tree from its
      # commit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: KVM and qemu
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-system-x86 qemu-system-misc opensbi
          test -w /dev/kvm

      # - name: Build 9rva23, 9rva23cpuwait and 9maxion
      - name: Build 9rva23 and 9rva23cpuwait
        run: |
          # for conf in rva23 rva23cpuwait maxion; do
          for conf in rva23 rva23cpuwait; do
            boot/rebuild -a riscv64 -c $conf kernel out/9$conf
          done
          (cd out && sha256sum * >SHA256SUMS)

      - name: Boot test 9rva23cpuwait
        run: boot/test out/9rva23cpuwait

      ## the Maxion hart has no Svpbmt, Zicbom or Sstc: neither may qemu's;
      ## maxion.bootrc runs the smoke test before its shell
      #- name: Boot test 9maxion
      #  run: |
      #    qemu-system-riscv64 -nodefaults -M virt -bios default \
      #      -cpu rv64,svpbmt=false,zicbom=false,sstc=false -m 1G -smp 1 \
      #      -kernel out/9maxion -nic none -display none -monitor none \
      #      -append 'console=0 user=glenda *maxion=1 *ncpu=1 *uartpoll=1' \
      #      -serial file:maxion.console -daemonize -pidfile maxion.pid
      #    trap 'kill $(cat maxion.pid)' EXIT
      #    for i in $(seq 120); do
      #      grep -qa MAXION-SMOKE-PASS maxion.console && break
      #      sleep 1
      #    done
      #    tr -d '\r' <maxion.console
      #    grep -qa MAXION-SMOKE-PASS maxion.console

      - name: Upload kernels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riscv64-kernels-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      # boot/rebuild and boot/test keep their machine's console when they fail
      - name: Upload consoles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riscv64-consoles-${{ github.sha }}
          path: |
            /tmp/tmp.*/console
            /tmp/tmp.*/log
            maxion.console
          if-no-files-found: ignore
          retention-days: 14
